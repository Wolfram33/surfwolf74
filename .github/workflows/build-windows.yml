name: Windows Build (Latest dev build)

# Baut die Windows-EXE (Nuitka) + den Inno-Setup-Installer und veroeffentlicht
# beides als oeffentliches Prerelease "latest-dev".

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'linux-kiosk/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: python -m pip install --upgrade pip PyQt6 PyQt6-WebEngine nuitka

      - name: Version aus surfwolf74.py lesen
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path surfwolf74.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          $v = if ($m) { $m.Matches[0].Groups[1].Value } else { "0.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: FFmpeg-DLLs beschaffen (fuer den Nuitka-Build noetig)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $dlls = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter *.dll | Where-Object { $_.Directory.Name -eq 'bin' }
          Copy-Item $dlls.FullName -Destination . -Force
          # Der Build erwartet eine Datei namens ffmpeg.dll -> aus avcodec erzeugen
          $avc = Get-ChildItem -Filter 'avcodec-*.dll' | Select-Object -First 1
          Copy-Item $avc.FullName -Destination ffmpeg.dll -Force
          Write-Host "DLLs bereit:"; Get-ChildItem *.dll | Select-Object Name, Length

      - name: Nuitka-Build (surfwolf74.exe)
        shell: pwsh
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest `
            --enable-plugin=pyqt6 `
            --include-data-files="ffmpeg.dll=ffmpeg.dll" `
            --include-data-files="icon.ico=icon.ico" `
            --include-data-files="bookmarks.json=bookmarks.json" `
            --include-data-files="config.json=config.json" `
            --include-data-files="blocked_sites.json=blocked_sites.json" `
            --windows-icon-from-ico="icon.ico" `
            --windows-console-mode=disable `
            --output-dir=. --output-filename="surfwolf74.exe" `
            surfwolf74.py
          if (-not (Test-Path "surfwolf74.dist\surfwolf74.exe")) { throw "EXE wurde nicht erzeugt" }

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y

      - name: Installer bauen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ steps.ver.outputs.version }}" `
            "windows-build\setup.iss"
          if (-not (Test-Path "dist\SurfWolf74-Setup.exe")) { throw "Installer wurde nicht erzeugt" }

      - name: Portable-ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path "surfwolf74.dist\*" -DestinationPath "dist\SurfWolf74-portable.zip" -Force

      - name: Als "latest-dev" veroeffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "Automatischer Windows-Build von master (Commit ${{ github.sha }}). Entwicklungs-Build, kein stabiles Release."
          gh release delete latest-dev --yes --cleanup-tag
          gh release create latest-dev --prerelease --title "Latest development build (v${{ steps.ver.outputs.version }})" --notes "$notes" "dist\SurfWolf74-Setup.exe" "dist\SurfWolf74-portable.zip"
