name: Windows Build (Latest dev build)

# Baut die Windows-EXE (Nuitka) + den Inno-Setup-Installer und veroeffentlicht
# beides als oeffentliches Prerelease "latest-dev".
#
# Haertung (11/2026):
# - Standardrechte nur Lesen; Schreibrecht nur fuer den Build-Job (Release).
# - Actions auf Commit-SHA gepinnt; Dependabot (.github/dependabot.yml) haelt
#   die Hashes aktuell.
# - Checkout ohne gespeichertes Token (persist-credentials: false).
# - FFmpeg-Download wird gegen die Pruefsummendatei des Releases geprueft.

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'linux-kiosk/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: write   # Prerelease "latest-dev" ersetzen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Versionen festgeschrieben = der lokal getestete Stand (.venv). Die
      # Qt-Binaerpakete (PyQt6-Qt6, PyQt6-WebEngine-Qt6) bleiben bewusst frei:
      # so kommen Patch-Releases mit Chromium-Sicherheitsfixes automatisch mit.
      - name: Abhaengigkeiten installieren
        run: python -m pip install --upgrade pip PyQt6==6.12.0 PyQt6-WebEngine==6.140.0 nuitka==4.3.5

      - name: Version aus surfwolf74.py lesen
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path surfwolf74.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          $v = if ($m) { $m.Matches[0].Groups[1].Value } else { "0.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Version: $v"

      - name: FFmpeg-DLLs beschaffen (fuer den Nuitka-Build noetig)
        shell: pwsh
        run: |
          $base = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          $name = "ffmpeg-master-latest-win64-gpl-shared.zip"
          Invoke-WebRequest -Uri "$base/$name" -OutFile ffmpeg.zip
          # Pruefsumme gegen die checksums.sha256 desselben Releases pruefen.
          # Schuetzt vor kaputten oder unterwegs veraenderten Downloads; gegen
          # ein kompromittiertes Upstream-Release hilft nur ein fest gepinnter
          # Build mit eigener Pruefsumme.
          Invoke-WebRequest -Uri "$base/checksums.sha256" -OutFile ffmpeg.sha256
          $line = Select-String -Path ffmpeg.sha256 -SimpleMatch "  $name" | Select-Object -First 1
          if (-not $line) { throw "Keine Pruefsumme fuer $name gefunden" }
          $expected = ($line.Line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash -Algorithm SHA256 ffmpeg.zip).Hash.ToLower()
          if ($actual -ne $expected) { throw "FFmpeg-Pruefsumme stimmt nicht: $actual statt $expected" }
          Write-Host "FFmpeg SHA256 ok: $actual"
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $dlls = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter *.dll | Where-Object { $_.Directory.Name -eq 'bin' }
          Copy-Item $dlls.FullName -Destination . -Force
          # Der Build erwartet eine Datei namens ffmpeg.dll -> aus avcodec erzeugen
          $avc = Get-ChildItem -Filter 'avcodec-*.dll' | Select-Object -First 1
          Copy-Item $avc.FullName -Destination ffmpeg.dll -Force
          Write-Host "DLLs bereit:"; Get-ChildItem *.dll | Select-Object Name, Length

      - name: Nuitka-Build (surfwolf74.exe)
        shell: pwsh
        run: |
          python -m nuitka --standalone --assume-yes-for-downloads --msvc=latest `
            --enable-plugin=pyqt6 `
            --include-data-files="ffmpeg.dll=ffmpeg.dll" `
            --include-data-files="icon.ico=icon.ico" `
            --include-data-files="bookmarks.json=bookmarks.json" `
            --include-data-files="config.json=config.json" `
            --include-data-files="blocked_sites.json=blocked_sites.json" `
            --windows-icon-from-ico="icon.ico" `
            --windows-console-mode=disable `
            --output-dir=. --output-filename="surfwolf74.exe" `
            surfwolf74.py
          if (-not (Test-Path "surfwolf74.dist\surfwolf74.exe")) { throw "EXE wurde nicht erzeugt" }

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y

      - name: Installer bauen
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:APP_VERSION" `
            "windows-build\setup.iss"
          if (-not (Test-Path "dist\SurfWolf74-Setup.exe")) { throw "Installer wurde nicht erzeugt" }

      - name: Portable-ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path "surfwolf74.dist\*" -DestinationPath "dist\SurfWolf74-portable.zip" -Force

      - name: Als "latest-dev" veroeffentlichen
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $sums = foreach ($f in 'dist\SurfWolf74-Setup.exe', 'dist\SurfWolf74-portable.zip') {
            "$((Get-FileHash -Algorithm SHA256 $f).Hash.ToLower())  $(Split-Path $f -Leaf)"
          }
          Set-Content -Path dist\SHA256SUMS.txt -Value $sums -Encoding ascii
          $notes = @(
            "Automatischer Windows-Build von master (Commit $env:GITHUB_SHA). Entwicklungs-Build, kein stabiles Release.",
            "",
            "**Hinweis zu Videos (Windows):** Reine H.264-Videos (z. B. **x.com / Twitter**) spielen aus Lizenzgruenden **nicht** im Browser ab; YouTube u. a. (VP9) laufen normal. Fuer H.264-Seiten den Button **Extern (Strg+E)** nutzen - er oeffnet die Seite im System-Browser. Die Linux-Version spielt H.264 nativ ab."
          )
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release delete latest-dev --yes --cleanup-tag
          gh release create latest-dev --prerelease --title "Latest development build (v$env:APP_VERSION)" --notes-file release-notes.md "dist\SurfWolf74-Setup.exe" "dist\SurfWolf74-portable.zip" "dist\SHA256SUMS.txt"
